<!DOCTYPE html>

<html lang="de">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Zehnerübergang – Addition im Zahlenraum bis 100</title>

  <style>

    :root {

      --bg: #f5f5f5;

      --card: #ffffff;

      --text: #222;

      --blue: #8fc0ff;

      --blue-dark: #4d8ff5;

      --ok: #cfeecf;

      --bad: #ffd7d7;

    }

    * {

      box-sizing: border-box;

    }

    body {

      margin: 0;

      padding: 24px;

      background: var(--bg);

      color: var(--text);

      font-family: Arial, sans-serif;

      text-align: center;

    }

    .wrap {

      max-width: 1200px;

      margin: 0 auto;

      padding: 24px;

      background: var(--card);

      border-radius: 20px;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

    }

    h1 {

      margin: 0 0 8px;

    }

    .sub {

      margin: 0 0 18px;

      color: #555;

    }

    .controls {

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;

      margin-bottom: 20px;

    }

    button {

      padding: 12px 18px;

      border: none;

      border-radius: 12px;

      background: var(--blue);

      font-size: 16px;

      cursor: pointer;

    }

    button.primary {

      background: var(--blue-dark);

      color: #fff;

    }

    button:hover {

      filter: brightness(0.97);

    }

    .grid {

      display: grid;

      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));

      gap: 18px;

      margin-top: 18px;

    }

    .task {

      min-height: 220px;

      padding: 18px 14px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      background: #fafafa;

      border: 2px solid #e4e4e4;

      border-radius: 18px;

    }

    .topline,

    .bottomline {

      display: flex;

      flex-wrap: nowrap;

      align-items: center;

      justify-content: center;

      gap: 8px;

      font-size: 28px;

      line-height: 1.6;

    }

    .bottomline {

      margin-top: 18px;

    }

    .slot {

      min-width: 56px;

      height: 48px;

      padding: 0 6px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      background: transparent;

      border-bottom: 4px solid #222;

      font-size: 28px;

      cursor: pointer;

    }

    .slot.small {

      min-width: 42px;

    }

    .slot.correct {

      background: var(--ok);

      border-radius: 8px;

    }

    .slot.wrong {

      background: var(--bad);

      border-radius: 8px;

    }

    .heart-target {

      position: relative;

      width: 126px;

      height: 98px;

      margin-left: 2px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

    }

    .heart-target svg {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      opacity: 0.38;

      pointer-events: none;

    }

    .heart-front {

      position: relative;

      padding-top: 6px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

    }

    .pool-title {

      margin-top: 22px;

      color: #555;

      font-size: 17px;

    }

    .pool {

      min-height: 58px;

      margin-top: 12px;

      display: flex;

      flex-wrap: wrap;

      justify-content: center;

      gap: 10px;

    }

    .tile {

      min-width: 58px;

      padding: 12px 16px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      background: var(--blue);

      border-radius: 12px;

      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);

      font-size: 24px;

      cursor: pointer;

      user-select: none;

    }

    .tile.selected {

      background: var(--blue-dark);

      color: #fff;

      outline: 3px solid #dbe7ff;

    }

    .msg {

      min-height: 28px;

      margin-top: 16px;

      font-size: 18px;

    }

    .hint {

      margin-top: 8px;

      color: #666;

      font-size: 14px;

    }

    @media (max-width: 640px) {

      body {

        padding: 12px;

      }

      .wrap {

        padding: 18px 10px;

      }

      .topline,

      .bottomline {

        gap: 6px;

        font-size: 22px;

      }

      .slot {

        min-width: 48px;

        height: 42px;

        font-size: 24px;

      }

      .slot.small {

        min-width: 38px;

      }

      .heart-target {

        width: 112px;

        height: 88px;

      }

      .heart-front {

        padding-top: 4px;

      }

    }

  </style>

</head>

<body>

  <div class="wrap">

    <h1>Zehnerübergang – Addition bis 100</h1>

    <p class="sub">

      Wähle unten eine Zahl und tippe anschließend auf den passenden Platz.

    </p>

    <div class="controls">

      <button id="checkBtn" class="primary">Überprüfen</button>

      <button id="clearBtn">Leeren</button>

      <button id="newBtn">Neue 6 Aufgaben</button>

    </div>

    <div id="taskGrid" class="grid"></div>

    <div class="pool-title">Vorgegebene Zahlen zum Einsetzen:</div>

    <div id="pool" class="pool"></div>

    <div id="msg" class="msg"></div>

    <div class="hint">

      Tipp: Zerlege den zweiten Summanden so, dass du zuerst bis zum nächsten

      Zehner rechnest.

    </div>

  </div>

  <script>

    const state = {

      tasks: [],

      selectedTile: null

    };

    const grid = document.getElementById("taskGrid");

    const pool = document.getElementById("pool");

    const msg = document.getElementById("msg");

    function shuffle(array) {

      const copy = array.slice();

      for (let i = copy.length - 1; i > 0; i--) {

        const randomIndex = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[randomIndex]] = [

          copy[randomIndex],

          copy[i]

        ];

      }

      return copy;

    }

    function randInt(min, max) {

      return Math.floor(Math.random() * (max - min + 1)) + min;

    }

    /*

      Beispiel:

      57 + 8 = 65

      Bis zum nächsten Zehner fehlen 3:

      57 + 3 + 5 = 65

    */

    function createTask(a, b) {

      const nextTen = Math.ceil(a / 10) * 10;

      const split1 = nextTen - a;

      const split2 = b - split1;

      const result = a + b;

      return {

        a,

        b,

        result,

        split1,

        split2

      };

    }

    function generateTasks(count) {

      const tasks = [];

      const used = new Set();

      while (tasks.length < count) {

        /*

          Der erste Summand liegt zwischen 21 und 89

          und darf kein voller Zehner sein.

        */

        const a = randInt(21, 89);

        const ones = a % 10;

        if (ones === 0) {

          continue;

        }

        /*

          Bis zum nächsten Zehner fehlende Zahl:

          Bei 57 fehlen beispielsweise 3.

        */

        const toNextTen = 10 - ones;

        /*

          Der zweite Summand muss größer als die Ergänzung

          zum nächsten Zehner sein, damit wirklich ein

          Zehnerübergang stattfindet.

        */

        const minB = toNextTen + 1;

        const maxB = Math.min(9, 100 - a);

        if (minB > maxB) {

          continue;

        }

        const b = randInt(minB, maxB);

        const key = `${a}+${b}`;

        if (!used.has(key)) {

          used.add(key);

          tasks.push(createTask(a, b));

        }

      }

      state.tasks = tasks;

    }

    function buildTaskHTML(task, index) {

      return `

        <div class="task" data-task="${index}">

          <div class="topline">

            <span>${task.a}</span>

            <span>+</span>

            <span>${task.b}</span>

            <span>=</span>

            <span

              class="slot"

              data-answer="${task.result}"

              aria-label="Ergebnis einsetzen"

            ></span>

          </div>

          <div class="bottomline">

            <span>${task.a}</span>

            <span>+</span>

            <span

              class="slot small"

              data-answer="${task.split1}"

              aria-label="Ersten Teil einsetzen"

            ></span>

            <span>+</span>

            <div class="heart-target">

              <svg viewBox="0 0 120 100" aria-hidden="true">

                <path

                  d="M60 92 L52 84 C20 56 8 43 8 25

                     C8 13 18 4 30 4

                     C41 4 49 11 60 24

                     C71 11 79 4 90 4

                     C102 4 112 13 112 25

                     C112 43 100 56 68 84 Z"

                  fill="white"

                  stroke="#666"

                  stroke-width="2"

                ></path>

              </svg>

              <div class="heart-front">

                <span

                  class="slot small"

                  data-answer="${task.split2}"

                  aria-label="Zweiten Teil einsetzen"

                ></span>

                <span>=</span>

                <span

                  class="slot"

                  data-answer="${task.result}"

                  aria-label="Ergebnis einsetzen"

                ></span>

              </div>

            </div>

          </div>

        </div>

      `;

    }

    function renderTasks() {

      grid.innerHTML = state.tasks

        .map((task, index) => buildTaskHTML(task, index))

        .join("");

      document.querySelectorAll(".slot").forEach((slot) => {

        slot.addEventListener("click", () => {

          if (!state.selectedTile) {

            msg.textContent = "Bitte wähle zuerst unten eine Zahl aus.";

            return;

          }

          /*

            Eine bereits verwendete Zahl wird wieder in den Pool

            zurückgelegt, wenn das Feld neu belegt wird.

          */

          const previousTileId = slot.dataset.tileId;

          if (previousTileId) {

            const previousTile = document.querySelector(

              `[data-tile-id="${previousTileId}"]`

            );

            if (previousTile) {

              previousTile.hidden = false;

            }

          }

          const tile = state.selectedTile;

          slot.textContent = tile.dataset.value;

          slot.dataset.tileId = tile.dataset.tileId;

          slot.classList.remove("correct", "wrong");

          tile.hidden = true;

          tile.classList.remove("selected");

          state.selectedTile = null;

          msg.textContent = "";

        });

      });

    }

    function renderPool() {

      const values = [];

      state.tasks.forEach((task) => {

        /*

          Pro Aufgabe werden vier Zahlen benötigt:

          Ergebnis oben, erster Teil, zweiter Teil,

          Ergebnis unten.

        */

        values.push(

          task.result,

          task.split1,

          task.split2,

          task.result

        );

      });

      const mixedValues = shuffle(values);

      pool.innerHTML = "";

      mixedValues.forEach((value, index) => {

        const tile = document.createElement("div");

        tile.className = "tile";

        tile.textContent = value;

        tile.dataset.value = value;

        tile.dataset.tileId = `tile-${index}`;

        tile.addEventListener("click", () => {

          document.querySelectorAll(".tile").forEach((otherTile) => {

            otherTile.classList.remove("selected");

          });

          tile.classList.add("selected");

          state.selectedTile = tile;

          msg.textContent = "";

        });

        pool.appendChild(tile);

      });

    }

    function clearAll() {

      document.querySelectorAll(".slot").forEach((slot) => {

        slot.textContent = "";

        slot.dataset.tileId = "";

        slot.classList.remove("correct", "wrong");

      });

      document.querySelectorAll(".tile").forEach((tile) => {

        tile.hidden = false;

        tile.classList.remove("selected");

      });

      state.selectedTile = null;

      msg.textContent = "";

    }

    function checkAll() {

      let allCorrect = true;

      let allFilled = true;

      document.querySelectorAll(".slot").forEach((slot) => {

        const correctAnswer = String(slot.dataset.answer);

        const enteredValue = slot.textContent.trim();

        slot.classList.remove("correct", "wrong");

        if (enteredValue === "") {

          slot.classList.add("wrong");

          allCorrect = false;

          allFilled = false;

        } else if (enteredValue === correctAnswer) {

          slot.classList.add("correct");

        } else {

          slot.classList.add("wrong");

          allCorrect = false;

        }

      });

      if (allCorrect) {

        msg.textContent = "✅ Super! Alles richtig.";

      } else if (!allFilled) {

        msg.textContent = "❌ Einige Felder sind noch leer.";

      } else {

        msg.textContent = "❌ Einige Felder stimmen noch nicht.";

      }

    }

    function newRound() {

      state.selectedTile = null;

      generateTasks(6);

      renderTasks();

      renderPool();

      msg.textContent = "";

    }

    document

      .getElementById("checkBtn")

      .addEventListener("click", checkAll);

    document

      .getElementById("clearBtn")

      .addEventListener("click", clearAll);

    document

      .getElementById("newBtn")

      .addEventListener("click", newRound);

    newRound();

  </script>

</body>

</html>
